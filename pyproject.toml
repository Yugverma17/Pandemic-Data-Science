[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandemic-ds"
version = "1.0.0"
description = "Reporting forensics, probabilistic forecasting, and causal inference on COVID-19 data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yug Verma" }]
keywords = ["epidemiology", "causal-inference", "forecasting", "data-quality"]

[project.urls]
Repository = "https://github.com/Yugverma17/Pandemic-Data-Science"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
